name: CI

# The release gate: every PR (and every push to main or a hotfix branch) must pass both jobs.
# Branch protection makes them required: see docs/ci.md.
on:
  push:
    branches: [main, 'hotfix/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (typecheck, unit tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  smoke:
    name: smoke (browser, production build)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Chromium for the pinned playwright-core, with the system libraries it needs.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright-core install --with-deps chromium
      # The built app, as it ships (no dev-only hooks).
      - run: npm run test:smoke
        env:
          SMOKE_PREVIEW: '1'

  physics-wasm:
    name: physics (Emscripten/Jolt integration)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build and test the Emscripten module
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          git clone --depth 1 --branch 3.1.64 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 3.1.64
          "$RUNNER_TEMP/emsdk/emsdk" activate 3.1.64
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          npm run physics:test
